name: Multi-Source IPTV Auto Merge

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: 运行检测脚本
      run: |
        python check.py

    - name: 提交更新结果
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: 自动拉取并过滤有效源 [skip ci]" && git push)
