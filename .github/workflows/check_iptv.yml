name: Multi-Source IPTV Auto Merge

on:
  schedule:
    - cron: '0 20 * * *'  # 每天 UTC 20:00 (北京时间 04:00) 自动触发
  workflow_dispatch:      # 允许手动触发按钮

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行检测
      run: |
        python check.py

    - name: 提交结果
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: 自动拉取并过滤有效源 [skip ci]" && git push)
