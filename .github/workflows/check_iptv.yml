name: Check and Update IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # 每天北京时间早上 3:00 运行

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp

      - name: Run Check Script
        run: |
          python check.py

      # 1. 提交更新到 GitHub 自身的仓库
      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update IPTV playlist [skip ci]" && git push)

     # 2. 自动同步推送至 Gitee 仓库（已修正分支与认证格式）
      - name: Sync to Gitee
        run: |
          git clone https://gitee.com/leecc250/caijingzhiboyuan.git gitee_repo || true
          if [ -d "gitee_repo" ]; then
            cp playlist.m3u gitee_repo/
            cd gitee_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add playlist.m3u
            git diff --quiet && git diff --cached --quiet || git commit -m "Sync playlist from GitHub Actions"
            
            # 使用正确的 Gitee Token 认证格式，并强制推送到 master 分支
            git remote set-url origin https://leecc250:aedd45e4596c414fd0fdd1b370ffd362@gitee.com/leecc250/caijingzhiboyuan.git
            git push origin master || git push origin main || true
          fi
